<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f8f5">
  <title>SkillSwap — Learn. Teach. Connect.</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20271f;
      background: #f8f8f5;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --ink: #20271f;
      --muted: #737b71;
      --green: #286249;
      --line: #e8e9e2;
      --paper: #f8f8f5;
      --white: #fff;
      --lime: #dff0a7;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #a5c9a9; outline-offset: 3px; }
    a { color: inherit; text-decoration: none; }
    .container { width: min(1120px, calc(100% - 44px)); margin-inline: auto; }

    .navbar { position: sticky; top: 0; z-index: 5; border-bottom: 1px solid rgba(228, 230, 222, .82); background: rgba(248, 248, 245, .92); backdrop-filter: blur(14px); }
    .nav-inner { display: flex; min-height: 74px; align-items: center; justify-content: space-between; gap: 25px; }
    .brand { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 10px; font-size: 17px; font-weight: 850; letter-spacing: -.055em; }
    .brand-icon { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; color: white; background: var(--green); font-size: 17px; }
    .brand-swap { color: var(--green); }
    .nav-links { display: flex; align-items: center; gap: 29px; color: #626b60; font-size: 12px; font-weight: 600; }
    .nav-links a:hover { color: var(--green); }
    .nav-actions { display: flex; align-items: center; gap: 9px; }
    .button { display: inline-flex; min-height: 41px; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; border: 1px solid transparent; border-radius: 8px; font-size: 12px; font-weight: 750; transition: transform .18s, background .18s, border-color .18s; }
    .button:hover { transform: translateY(-1px); }
    .button-primary { color: #fff; background: var(--green); }
    .button-primary:hover { background: #1d503a; }
    .button-quiet { border-color: var(--line); color: #3d493d; background: #fff; }
    .button-quiet:hover { border-color: #c9d6c9; }
    .menu-button { display: none; width: 40px; height: 40px; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 18px; }

    .hero { position: relative; display: grid; min-height: 560px; grid-template-columns: 1.05fr .95fr; align-items: center; gap: 60px; padding-block: 65px 82px; }
    .hero-copy { position: relative; z-index: 1; }
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid #e5e8de; border-radius: 99px; color: #5f6a5b; background: #fff; font-size: 10px; font-weight: 650; }
    .pill-dot { width: 7px; height: 7px; border-radius: 50%; background: #72aa72; box-shadow: 0 0 0 3px #edf6e9; }
    h1 { max-width: 570px; margin: 22px 0 17px; font-size: clamp(48px, 6.7vw, 77px); font-weight: 620; letter-spacing: -.078em; line-height: .99; }
    .hero-accent { color: var(--green); }
    .hero-description { max-width: 440px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 27px; }
    .hero-actions .button { min-height: 47px; padding-inline: 19px; }
    .arrow { font-size: 15px; }
    .hero-proof { display: flex; align-items: center; gap: 12px; margin-top: 28px; color: #6d766b; font-size: 10px; }
    .avatar-stack { display: flex; padding-left: 3px; }
    .avatar { display: grid; width: 25px; height: 25px; place-items: center; margin-left: -4px; border: 2px solid var(--paper); border-radius: 50%; color: #355140; background: #d8e9d8; font-size: 8px; font-weight: 800; }
    .avatar:nth-child(2) { color: #725333; background: #efdfc7; }
    .avatar:nth-child(3) { color: #5d4a75; background: #e5dcf0; }
    .avatar:nth-child(4) { color: #884f46; background: #f1ddd5; }

    .hero-art { position: relative; min-height: 390px; }
    .art-orbit { position: absolute; inset: 19px 6px 10px 22px; border: 1px solid #e6e9df; border-radius: 50%; transform: rotate(-13deg); }
    .art-orbit::before { position: absolute; inset: 26px -16px; border: 1px dashed #e4e7dc; border-radius: 50%; content: ""; }
    .art-card { position: absolute; border: 1px solid rgba(230, 232, 225, .9); border-radius: 14px; background: rgba(255, 255, 255, .95); box-shadow: 0 15px 40px rgba(46, 62, 44, .08); }
    .profile-card { top: 46px; right: 23px; width: 255px; padding: 18px; transform: rotate(3deg); }
    .profile-top { display: flex; align-items: center; gap: 11px; }
    .profile-photo { display: grid; width: 39px; height: 39px; place-items: center; border-radius: 12px; color: #735340; background: #f4e2cf; font-size: 16px; font-weight: 800; }
    .profile-name { font-size: 11px; font-weight: 800; }
    .profile-college { margin-top: 4px; color: #889084; font-size: 9px; }
    .online-label { margin-left: auto; padding: 5px 7px; border-radius: 20px; color: #34734e; background: #eef6eb; font-size: 8px; font-weight: 750; }
    .skill-caption { margin: 17px 0 7px; color: #8a9287; font-size: 8px; font-weight: 750; letter-spacing: .12em; }
    .skill-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .skill-chip { padding: 6px 8px; border-radius: 6px; color: #395842; background: #eff5e9; font-size: 9px; font-weight: 650; }
    .skill-chip.wanted { color: #765b40; background: #f8f1e6; }
    .match-card { top: 187px; left: 0; width: 249px; padding: 15px; transform: rotate(-4deg); }
    .match-label { display: flex; align-items: center; justify-content: space-between; color: #737c70; font-size: 9px; font-weight: 750; }
    .match-score { color: var(--green); font-size: 10px; font-weight: 850; }
    .match-people { display: flex; align-items: center; justify-content: space-between; margin-top: 15px; }
    .person { display: flex; align-items: center; gap: 7px; font-size: 9px; font-weight: 700; }
    .person-bubble { display: grid; width: 27px; height: 27px; place-items: center; border-radius: 50%; color: #5f4b6e; background: #e9e0f0; font-size: 9px; }
    .person-bubble.second { color: #46664a; background: #dfebd8; }
    .swap-icon { color: #9eaa98; font-size: 15px; }
    .match-skills { margin-top: 13px; padding: 9px 10px; border-radius: 7px; color: #5e695b; background: #f7f8f3; font-size: 8px; text-align: center; }
    .floating-note { position: absolute; right: 1px; bottom: 34px; display: flex; align-items: center; gap: 9px; padding: 11px 13px; transform: rotate(-2deg); }
    .note-icon { display: grid; width: 27px; height: 27px; place-items: center; border-radius: 8px; color: #516b36; background: var(--lime); }
    .note-title { color: #3d493b; font-size: 9px; font-weight: 750; }
    .note-subtitle { margin-top: 3px; color: #8b9388; font-size: 8px; }
    .sparkle { position: absolute; top: 65px; left: 6px; color: #b4c76b; font-size: 21px; }

    .section { padding-block: 74px; }
    .how-section { border-block: 1px solid #ecece6; background: #fff; }
    .section-heading { max-width: 570px; margin: 0 auto 38px; text-align: center; }
    .section-kicker { margin: 0 0 11px; color: var(--green); font-size: 9px; font-weight: 850; letter-spacing: .15em; }
    .section-heading h2 { margin: 0; font-size: clamp(29px, 4vw, 40px); letter-spacing: -.06em; }
    .section-heading > p:last-child { margin: 10px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .step { min-height: 170px; padding: 19px; border: 1px solid var(--line); border-radius: 11px; background: #fff; }
    .step-number { display: grid; width: 31px; height: 31px; place-items: center; border-radius: 9px; color: var(--green); background: #eef5e9; font-size: 11px; font-weight: 800; }
    .step h3 { margin: 17px 0 7px; font-size: 13px; letter-spacing: -.02em; }
    .step p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.7; }
    .skills-section { padding-bottom: 80px; }
    .skill-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
    .popular-skill { display: flex; min-height: 69px; align-items: center; gap: 10px; padding: 13px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .popular-icon { display: grid; width: 31px; height: 31px; flex: 0 0 auto; place-items: center; border-radius: 9px; color: #426349; background: #eff5e9; font-size: 13px; font-weight: 800; }
    .popular-skill:nth-child(2n) .popular-icon { color: #785b40; background: #f7f0e5; }
    .popular-name { font-size: 10px; font-weight: 750; }
    .popular-type { margin-top: 4px; color: #8d958b; font-size: 8px; }
    .bottom-cta { display: flex; align-items: center; justify-content: space-between; gap: 25px; padding: 28px 31px; border-radius: 13px; color: #fff; background: #1d4938; }
    .bottom-cta h2 { margin: 0; font-size: 21px; letter-spacing: -.045em; }
    .bottom-cta p { margin: 7px 0 0; color: #c0d1c1; font-size: 11px; }
    .bottom-cta .button { flex: 0 0 auto; color: #203727; background: var(--lime); }
    .footer { border-top: 1px solid var(--line); background: #fff; }
    .footer-inner { display: flex; min-height: 76px; align-items: center; justify-content: space-between; gap: 15px; color: #858d82; font-size: 10px; }
    .footer-links { display: flex; gap: 18px; }
    .footer-links a:hover { color: var(--green); }

    .modal-backdrop { position: fixed; inset: 0; z-index: 10; display: grid; overflow-y: auto; place-items: center; padding: 22px; background: rgba(22, 36, 27, .52); backdrop-filter: blur(5px); }
    .auth-modal { position: relative; width: min(430px, 100%); padding: 28px; border: 1px solid rgba(255, 255, 255, .7); border-radius: 15px; background: #fff; box-shadow: 0 30px 90px rgba(11, 25, 16, .24); }
    .modal-close { position: absolute; top: 15px; right: 15px; display: grid; width: 31px; height: 31px; place-items: center; border: 1px solid var(--line); border-radius: 8px; color: #697267; background: #fff; font-size: 17px; }
    .modal-brand { margin-bottom: 25px; }
    .modal-title { margin: 0; font-size: 24px; letter-spacing: -.055em; }
    .modal-description { margin: 7px 0 20px; color: var(--muted); font-size: 11px; line-height: 1.65; }
    .auth-form { display: grid; gap: 13px; }
    .form-field label { display: block; margin-bottom: 6px; color: #475146; font-size: 10px; font-weight: 750; }
    .form-field input, .form-field select { width: 100%; min-height: 41px; padding: 0 11px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: #fff; font-size: 11px; }
    .form-field input:focus, .form-field select:focus { border-color: #7fa589; outline: 0; box-shadow: 0 0 0 3px rgba(40, 98, 73, .09); }
    .auth-submit { width: 100%; margin-top: 5px; }
    .form-message { min-height: 17px; margin: 0; color: var(--green); font-size: 10px; line-height: 1.6; }
    .form-message.error { color: #ad4238; }
    .mode-switch { margin: 16px 0 0; color: var(--muted); font-size: 10px; text-align: center; }
    .mode-switch button { padding: 0; border: 0; color: var(--green); background: transparent; font-size: inherit; font-weight: 800; }
    .prototype-note { margin: 17px 0 0; padding: 10px; border-radius: 7px; color: #747d70; background: #f5f7f1; font-size: 9px; line-height: 1.6; }
    .prototype-note strong { color: #475246; }
    .mobile-menu { display: none; }

    @media (max-width: 850px) {
      .nav-links { gap: 17px; }
      .hero { min-height: 510px; gap: 22px; }
      .hero-art { transform: scale(.9); transform-origin: center; }
      .steps { grid-template-columns: repeat(2, 1fr); }
      .skill-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 650px) {
      .container { width: min(100% - 30px, 540px); }
      .nav-inner { min-height: 65px; }
      .nav-links { display: none; }
      .nav-actions .button-quiet { display: none; }
      .nav-actions .button { min-height: 37px; padding-inline: 12px; font-size: 10px; }
      .hero { min-height: auto; grid-template-columns: 1fr; gap: 0; padding-block: 58px 35px; }
      h1 { max-width: 490px; font-size: clamp(51px, 13vw, 71px); }
      .hero-description { max-width: 410px; font-size: 13px; }
      .hero-art { width: min(100%, 390px); min-height: 340px; margin: 19px auto 0; transform: scale(.92); }
      .profile-card { right: 7px; }
      .match-card { left: 0; }
      .floating-note { right: 0; bottom: 11px; }
      .section { padding-block: 57px; }
      .steps { gap: 9px; }
      .step { min-height: 157px; padding: 15px; }
      .skill-grid { grid-template-columns: repeat(2, 1fr); }
      .bottom-cta { align-items: flex-start; flex-direction: column; padding: 24px; }
      .footer-inner { align-items: flex-start; flex-direction: column; justify-content: center; padding-block: 18px; }
      .modal-backdrop { align-items: end; padding: 10px; }
      .auth-modal { max-height: calc(100vh - 20px); overflow-y: auto; padding: 24px 21px; }
    }
    @media (max-width: 380px) {
      .hero-art { margin-left: -5px; transform: scale(.84); transform-origin: top left; width: calc(100% + 20px); margin-bottom: -45px; }
      .steps { grid-template-columns: 1fr; }
      .step { min-height: auto; }
      .step h3 { margin-top: 11px; }
    }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useState } = React;

    const popularSkills = [
      { name: "Python", category: "Programming", icon: "Py" },
      { name: "Java", category: "Programming", icon: "J" },
      { name: "SQL", category: "Data", icon: "⌘" },
      { name: "React", category: "Web development", icon: "⚛" },
      { name: "Excel", category: "Productivity", icon: "▦" },
      { name: "UI/UX", category: "Design", icon: "✳" },
    ];

    function Brand({ className = "" }) {
      return (
        <a className={`brand ${className}`} href="#home" aria-label="SkillSwap home">
          <span className="brand-icon" aria-hidden="true">↗</span>
          <span>Skill<span className="brand-swap">Swap</span></span>
        </a>
      );
    }

    function AuthModal({ mode, onClose, onModeChange }) {
      const [values, setValues] = useState({ name: "", email: "", password: "", college: "", department: "", year: "" });
      const [message, setMessage] = useState("");
      const [hasError, setHasError] = useState(false);

      useEffect(() => {
        function handleKeyDown(event) {
          if (event.key === "Escape") onClose();
        }
        document.addEventListener("keydown", handleKeyDown);
        return () => document.removeEventListener("keydown", handleKeyDown);
      }, [onClose]);

      function updateValue(event) {
        setValues((current) => ({ ...current, [event.target.name]: event.target.value }));
        setMessage("");
      }

      function submit(event) {
        event.preventDefault();
        setHasError(false);
        if (mode === "register" && (!values.name.trim() || !values.college.trim() || !values.department.trim() || !values.year)) {
          setHasError(true);
          setMessage("Please complete all the required fields.");
          return;
        }
        if (!values.email.trim() || !values.password) {
          setHasError(true);
          setMessage("Enter your email address and password.");
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email.trim())) {
          setHasError(true);
          setMessage("Enter a valid email address.");
          return;
        }
        if (values.password.length < 8) {
          setHasError(true);
          setMessage("Use a password with at least 8 characters.");
          return;
        }

        const email = values.email.trim();
        const session = {
          name: isRegister ? values.name.trim() : email.split("@")[0],
          email,
          college: isRegister ? values.college.trim() : "",
          department: isRegister ? values.department.trim() : "",
          year: isRegister ? values.year : "",
          mode: "demo",
        };

        try {
          sessionStorage.setItem("skillswap-demo-session", JSON.stringify(session));
          window.location.assign("aat1-dashboard.html");
        } catch (error) {
          setHasError(true);
          setMessage("Sign-in could not be completed because this browser blocked session storage.");
        }
      }

      const isRegister = mode === "register";

      return (
        <div className="modal-backdrop" onMouseDown={(event) => { if (event.target === event.currentTarget) onClose(); }}>
          <section className="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-title">
            <button className="modal-close" type="button" onClick={onClose} aria-label="Close dialog">×</button>
            <Brand className="modal-brand" />
            <h2 className="modal-title" id="auth-title">{isRegister ? "Create your account" : "Welcome back"}</h2>
            <p className="modal-description">
              {isRegister ? "Join your campus community and start sharing what you know." : "Sign in to continue building skills with your peers."}
            </p>
            <form className="auth-form" onSubmit={submit} noValidate>
              {isRegister && <>
                <div className="form-field">
                  <label htmlFor="auth-name">Full name</label>
                  <input id="auth-name" name="name" autoComplete="name" placeholder="e.g. Ashmitha Rao" value={values.name} onChange={updateValue} />
                </div>
              </>}
              <div className="form-field">
                <label htmlFor="auth-email">College email</label>
                <input id="auth-email" name="email" type="email" autoComplete="email" placeholder="you@example.edu" value={values.email} onChange={updateValue} />
              </div>
              <div className="form-field">
                <label htmlFor="auth-password">Password</label>
                <input id="auth-password" name="password" type="password" autoComplete={isRegister ? "new-password" : "current-password"} minLength="8" placeholder="At least 8 characters" value={values.password} onChange={updateValue} />
              </div>
              {isRegister && <>
                <div className="form-field">
                  <label htmlFor="auth-college">College</label>
                  <input id="auth-college" name="college" autoComplete="organization" placeholder="Your college name" value={values.college} onChange={updateValue} />
                </div>
                <div className="form-field">
                  <label htmlFor="auth-department">Department</label>
                  <input id="auth-department" name="department" placeholder="e.g. Computer Science" value={values.department} onChange={updateValue} />
                </div>
                <div className="form-field">
                  <label htmlFor="auth-year">Year of study</label>
                  <select id="auth-year" name="year" value={values.year} onChange={updateValue}>
                    <option value="">Select your year</option>
                    <option value="1">1st year</option>
                    <option value="2">2nd year</option>
                    <option value="3">3rd year</option>
                    <option value="4">4th year</option>
                    <option value="5">5th year</option>
                  </select>
                </div>
              </>}
              <button className="button button-primary auth-submit" type="submit">{isRegister ? "Create account" : "Sign in"}</button>
              <p className={`form-message${hasError ? " error" : ""}`} role="status" aria-live="polite">{message}</p>
            </form>
            <p className="mode-switch">
              {isRegister ? "Already part of SkillSwap? " : "New to SkillSwap? "}
              <button type="button" onClick={() => onModeChange(isRegister ? "login" : "register")}>
                {isRegister ? "Sign in" : "Create an account"}
              </button>
            </p>
            <p className="prototype-note"><strong>Demo mode:</strong> any valid email and password with at least 8 characters opens a temporary browser session and redirects to the dashboard. Passwords are not saved. This is not production authentication.</p>
          </section>
        </div>
      );
    }

    function App() {
      const [authMode, setAuthMode] = useState(() => new URLSearchParams(window.location.search).get("auth") === "login" ? "login" : null);
      const [menuOpen, setMenuOpen] = useState(false);

      function openAuth(mode) {
        setMenuOpen(false);
        setAuthMode(mode);
      }

      function joinExchange() {
        try {
          const session = JSON.parse(sessionStorage.getItem("skillswap-demo-session") || "null");
          if (session?.email) {
            window.location.assign("aat1-dashboard.html#explore");
            return;
          }
        } catch (error) {
          openAuth("register");
          return;
        }
        openAuth("register");
      }

      return (
        <>
          <header className="navbar" id="home">
            <div className="container nav-inner">
              <Brand />
              <nav className="nav-links" aria-label="Main navigation">
                <a href="#how-it-works">How it works</a>
                <a href="#popular-skills">Explore skills</a>
                <a href="#about">About</a>
              </nav>
              <div className="nav-actions">
                <button className="button button-quiet" type="button" onClick={() => openAuth("login")}>Log in</button>
                <button className="button button-primary" type="button" onClick={() => openAuth("register")}>Get started <span aria-hidden="true">↗</span></button>
              </div>
            </div>
          </header>

          <main>
            <section className="container hero" aria-labelledby="hero-heading">
              <div className="hero-copy">
                <span className="pill"><span className="pill-dot"></span> A student-powered skill community</span>
                <h1 id="hero-heading">Learn a little.<br />Teach a little.<br /><span className="hero-accent">Grow together.</span></h1>
                <p className="hero-description">Trade what you know for what you want to learn. Find your people, share your skills, and make campus learning a two-way street.</p>
                <div className="hero-actions">
                  <button className="button button-primary" type="button" onClick={() => openAuth("register")}>Create your profile <span className="arrow" aria-hidden="true">→</span></button>
                  <a className="button button-quiet" href="#how-it-works">See how it works</a>
                </div>
                <div className="hero-proof">
                  <div className="avatar-stack" aria-hidden="true">
                    <span className="avatar">AR</span><span className="avatar">PK</span><span className="avatar">MS</span><span className="avatar">+</span>
                  </div>
                  <span>Built for students, by students</span>
                </div>
              </div>
              <div className="hero-art" aria-label="Illustration of students matching teaching and learning skills">
                <div className="art-orbit"></div>
                <span className="sparkle" aria-hidden="true">✳</span>
                <article className="art-card profile-card">
                  <div className="profile-top">
                    <div className="profile-photo">P</div>
                    <div><div className="profile-name">Priya K.</div><div className="profile-college">Computer Science · Year 3</div></div>
                    <span className="online-label">ONLINE</span>
                  </div>
                  <p className="skill-caption">CAN TEACH</p>
                  <div className="skill-chips"><span className="skill-chip">React</span><span className="skill-chip">UI/UX</span></div>
                  <p className="skill-caption">WANTS TO LEARN</p>
                  <div className="skill-chips"><span className="skill-chip wanted">Python</span><span className="skill-chip wanted">SQL</span></div>
                </article>
                <article className="art-card match-card">
                  <div className="match-label"><span>A SKILL MATCH</span><span className="match-score">100% ✦</span></div>
                  <div className="match-people">
                    <span className="person"><span className="person-bubble">R</span>Rahul</span>
                    <span className="swap-icon" aria-hidden="true">⇄</span>
                    <span className="person"><span className="person-bubble second">P</span>Priya</span>
                  </div>
                  <div className="match-skills">Python ↔ React · a perfect skill swap</div>
                </article>
                <article className="art-card floating-note">
                  <span className="note-icon" aria-hidden="true">✦</span>
                  <span><span className="note-title">Everyone has something to share</span><br /><span className="note-subtitle">Your next skill starts with a hello.</span></span>
                </article>
              </div>
            </section>

            <section className="how-section" id="how-it-works">
              <div className="container section">
                <div className="section-heading">
                  <p className="section-kicker">A SIMPLE IDEA, A BIG EXCHANGE</p>
                  <h2>Good things happen when skills are shared.</h2>
                  <p>Find a peer whose skills complement yours and learn from each other, one conversation at a time.</p>
                </div>
                <div className="steps">
                  <article className="step"><span className="step-number">01</span><h3>Create your profile</h3><p>Tell your campus community a little about you and what you enjoy.</p></article>
                  <article className="step"><span className="step-number">02</span><h3>Share your skills</h3><p>Add what you can teach and what you’re excited to learn.</p></article>
                  <article className="step"><span className="step-number">03</span><h3>Find your match</h3><p>Discover students whose skills line up with what you’re looking for.</p></article>
                  <article className="step"><span className="step-number">04</span><h3>Learn together</h3><p>Say hello, plan an exchange, and grow together at your own pace.</p></article>
                </div>
              </div>
            </section>

            <section className="container section skills-section" id="popular-skills">
              <div className="section-heading">
                <p className="section-kicker">START WITH WHAT YOU LOVE</p>
                <h2>There’s a skill for that.</h2>
                <p>From code to creative craft, every skill can open a door for someone.</p>
              </div>
              <div className="skill-grid">
                {popularSkills.map((skill) => (
                  <article className="popular-skill" key={skill.name}>
                    <span className="popular-icon" aria-hidden="true">{skill.icon}</span>
                    <span><span className="popular-name">{skill.name}</span><br /><span className="popular-type">{skill.category}</span></span>
                  </article>
                ))}
              </div>
            </section>

            <section className="container" id="about" style={{ paddingBottom: "58px" }}>
              <div className="bottom-cta">
                <div><h2>Your next favorite skill is one conversation away.</h2><p>Bring what you know. Leave with something new.</p></div>
                <button className="button" type="button" onClick={joinExchange}>Join the exchange <span aria-hidden="true">→</span></button>
              </div>
            </section>
          </main>

          <footer className="footer">
            <div className="container footer-inner">
              <Brand />
              <span>Learn. Teach. Connect. Built for campus communities.</span>
              <nav className="footer-links" aria-label="Footer navigation"><a href="#how-it-works">How it works</a><a href="#popular-skills">Skills</a><button type="button" onClick={() => openAuth("login")} style={{ padding: 0, border: 0, color: "inherit", background: "transparent", font: "inherit", cursor: "pointer" }}>Log in</button></nav>
            </div>
          </footer>
          {authMode && <AuthModal mode={authMode} onClose={() => setAuthMode(null)} onModeChange={setAuthMode} />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
